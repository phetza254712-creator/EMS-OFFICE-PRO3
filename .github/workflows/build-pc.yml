name: EMS Office Pro - Windows PC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package Windows Application
        run: npm run desktop:build

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: EMS-Office-Pro-Windows
          path: |
            release/*.exe
            release/*.msi
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
