name: EMS Office Pro - Windows PC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/build-pc.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Prepare Electron main file
        shell: pwsh
        run: |
          if (!(Test-Path "main.cjs")) {
            throw "ไม่พบไฟล์ main.cjs ในโปรเจกต์"
          }

          New-Item -ItemType Directory -Force -Path "electron" | Out-Null
          Copy-Item "main.cjs" "electron/main.cjs" -Force

      - name: Build and Package Windows Application
        run: npm run desktop:build

      - name: Verify Windows Installer
        shell: pwsh
        run: |
          if (!(Test-Path "release")) {
            throw "ไม่พบโฟลเดอร์ release"
          }

          $installer = Get-ChildItem "release" -Filter "*.exe" -File

          if (!$installer) {
            throw "ไม่พบไฟล์ติดตั้ง EXE"
          }

          Write-Host "พบไฟล์ติดตั้ง:"
          $installer | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: EMS-Office-Pro-Windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
